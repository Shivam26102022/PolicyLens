[project]
name = "policylens"
version = "0.1.0"
description = "PolicyLens API and bounded research host"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.2,<1",
    "chromadb>=1.0,<2",
    "fastapi==0.162.0",
    "fastembed>=0.9.1,<1",
    "mcp==2.3.0",
    "openai==3.37.0",
    "openai-agents==0.24.0",
    "pydantic-settings==2.16.1",
    "tiktoken>=0.9,<1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "httpx2>=2.10,<3",
    "matplotlib>=3.10,<4",
    "mypy>=1.18,<2",
    "PyMuPDF>=1.26,<2",
    "PyYAML>=6,<7",
    "pytest>=9,<10",
    "ruff>=0.14,<0.15",
    "types-PyYAML>=6,<7",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"