[project]
name = "policylens-mcp"
version = "0.1.0"
description = "Standalone PolicyLens policy-data MCP service"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pydantic-settings==2.16.1",
    "PyYAML>=6,<7",
]

[project.scripts]
policylens-mcp = "policylens_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"