name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-and-mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.13.0
      - name: Sync locked workspace
        run: uv sync --locked --all-packages --all-groups
      - name: Python formatting
        run: make format-check-python
      - name: Python lint
        run: make lint-python
      - name: Python type check
        run: make typecheck-python
      - name: Python tests
        run: make test-python
      - name: Python coverage
        run: make coverage-python
      - name: Traceability
        run: make traceability
      - name: MCP stdio health
        run: make mcp-health

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix apps/frontend
      - name: Frontend formatting
        run: npm --prefix apps/frontend run format:check
      - name: Frontend lint
        run: npm --prefix apps/frontend run lint
      - name: Frontend type check
        run: npm --prefix apps/frontend run typecheck
      - name: Frontend tests
        run: npm --prefix apps/frontend test
      - name: Frontend coverage
        run: npm --prefix apps/frontend run coverage
      - name: Frontend production build
        run: npm --prefix apps/frontend run build